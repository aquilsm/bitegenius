trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:
- stage: Build
  displayName: Docker Build Stage
  jobs:
  - job: BuildDockerImage
    displayName: Build Docker Image
    steps:
    - checkout: self

    - task: Docker@2
      displayName: Build Docker Image
      inputs:
        command: build
        dockerfile: Dockerfile
        repository: bitegenius
        tags: |
          ci-test
