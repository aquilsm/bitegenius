version: "3.9"

services:
  web:
    build: .
    container_name: bitegenius-web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: bitegenius.settings
      DJANGO_DEBUG: "True"
