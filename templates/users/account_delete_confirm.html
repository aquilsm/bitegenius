{% extends "base.html" %}
{% block content %}

<h2>⚠️ Delete Account</h2>

<p style="color:red;">
    This will permanently delete your account, all your saved favorites, weekly plans, and profile data.
    This action cannot be undone.
</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" style="background:red;color:white;padding:8px 16px;border:none;border-radius:4px;">
        Delete My Account
    </button>
    <a href="{% url 'account' %}" style="margin-left:16px;">Cancel</a>
</form>

{% endblock %}
